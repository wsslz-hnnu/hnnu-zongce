<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2f6bff">
<meta name="description" content="湖南师范大学医学部本科生综合素质测评计算器 · 纯本地运行，数据不上传">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6bff'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%E7%BB%BC%3C/text%3E%3C/svg%3E">
<title>医学部综测测评 · 个人版</title>
<style>




















*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f7f9;--card:#fff;--line:#e3e6ea;--text:#1d2126;--muted:#6b7381;
  --primary:#2f6bff;--primary-d:#2456d6;--ok:#1a9e5c;--warn:#d9822b;--bad:#d64545;
  --soft:#eef2fb;--radius:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 80px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:20px;font-weight:650;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text);
  padding:7px 13px;border-radius:8px;transition:.15s;white-space:nowrap}
button:hover{border-color:#c6ccd6;background:#fbfcfd}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:550}
button.primary:hover{background:var(--primary-d);border-color:var(--primary-d)}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button.tiny{padding:3px 8px;font-size:12px;border-radius:6px}
button:focus-visible,a:focus-visible,.card-h:focus-visible,.f3-card:focus-visible,
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:7px;
  padding:6px 9px;background:#fff;width:100%;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(47,107,255,.1)}
input[type=checkbox]{width:auto;margin-right:5px;vertical-align:-1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;
  border-bottom:1px solid var(--line);background:#fcfcfd;cursor:pointer;user-select:none}
.card-h:hover{background:#fafbfc}
.card-h h2{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-h .meta{font-size:12.5px;color:var(--muted);font-weight:400}
.card-b{padding:16px}
.collapsed .card-b{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;
  border-radius:20px;background:var(--soft);color:var(--primary);font-weight:500}
.pill.ok{background:#e8f7ee;color:var(--ok)}
.pill.warn{background:#fdf3e6;color:var(--warn)}
.pill.bad{background:#fdecec;color:var(--bad)}
.pill.gray{background:#f1f3f5;color:var(--muted)}

/* 汇总 */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.sum-cell{background:#fff;padding:14px 16px}
.sum-cell .k{font-size:12px;color:var(--muted);margin-bottom:2px}
.sum-cell .v{font-size:22px;font-weight:650;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.sum-cell.total{background:linear-gradient(135deg,#2f6bff,#5b8cff);color:#fff}
.sum-cell.total .k{color:rgba(255,255,255,.8)}
.sum-cell .w{font-size:11px;color:var(--muted);margin-top:1px}
.sum-cell.total .w{color:rgba(255,255,255,.7)}

/* 表单 */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;color:var(--muted)}
.field.inline{flex-direction:row;align-items:center;gap:6px}
.field.inline label{color:var(--text);font-size:13px}
.hint{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.row-item{display:grid;gap:8px;align-items:end;padding:10px 12px;background:#fafbfc;
  border:1px solid var(--line);border-radius:9px;margin-bottom:8px}
.row-item .del{justify-self:end}
.empty{color:var(--muted);font-size:12.5px;padding:8px 0}
.sub-head{font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 8px;
  text-transform:none;letter-spacing:.2px}
.sub-head:first-child{margin-top:0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;background:#fbfcfd}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.note-list{font-size:12px;color:var(--muted);line-height:1.7;padding-left:2px}
.note-list li{list-style:none;padding-left:14px;position:relative}
.note-list li::before{content:"·";position:absolute;left:4px;color:#aab}
.alert{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:9px;
  font-size:12.5px;margin-top:10px;line-height:1.5}
.alert.warn{background:#fdf6ec;color:#8a5a13}
.alert.ok{background:#edf9f2;color:#166b40}
.alert.bad{background:#fdefef;color:#8f2626}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px;
  padding-bottom:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 12px;font-size:13px;color:var(--muted);border:none;background:none;border-radius:8px 8px 0 0;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text);background:#f0f3f7}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;background:none}
.badge-dot{display:inline-block;min-width:17px;height:17px;line-height:17px;padding:0 4px;font-size:10.5px;
  border-radius:9px;background:var(--soft);color:var(--primary);text-align:center;margin-left:5px}
footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:28px;line-height:1.8}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#222;color:#fff;
  padding:9px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:560px){
  .f1-line{grid-template-columns:1fr 84px;row-gap:6px}
  .f1-line button{grid-column:1/-1;justify-self:end}
  .f1-block-h{padding:8px 11px}
  .f1-block-b{padding:10px 11px 12px}
  .f1-desc{margin-bottom:9px}
}
@media (max-width:600px){
  .wrap{padding:14px 11px 70px}
  h1{font-size:17px}
  .sum-cell .v{font-size:19px}
  .card-b{padding:13px}
  /* 移动端放大点击热区，避免误触删除 */
  .tiny{min-height:32px;padding:5px 10px}
  .row-item .del,.lec-row button{min-height:32px}
}
/* ---------- 打印：A4 单页尽量压缩 ---------- */
@page{ size:A4 portrait; margin:10mm; }
@media print{
  html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{
    font-size:11.5px;line-height:1.35;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .wrap{max-width:none;margin:0;padding:0}

  /* 隐藏交互元素、提示与缩略条 */
  .toolbar,.tabs,button,footer,#lightbox,.toast,
  .print-hide,.proof-mini,details{display:none!important}
  .collapsed .card-b{display:block!important}
  .table-wrap{overflow:visible!important}

  header{margin:0 0 5px}
  h1{font-size:15px;letter-spacing:0}
  .sub{font-size:9px;margin-top:1px}

  /* 汇总条：五格并排、压缩高度 */
  .summary{margin:0 0 5px;grid-template-columns:repeat(5,1fr);border-radius:6px}
  .sum-cell{padding:4px 7px}
  .sum-cell .k{font-size:9px;margin:0}
  .sum-cell .v{font-size:15px;letter-spacing:0;line-height:1.25}
  .sum-cell .w{font-size:8.5px;margin:0;line-height:1.25}
  /* 黑白打印也要看得清：浅底深字 + 左侧色条 */
  .sum-cell.total{background:#eef2fb!important;color:#1d2126!important;
    box-shadow:inset 2px 0 0 #2f6bff!important;border-radius:0}
  .sum-cell.total .k,.sum-cell.total .w{color:#5a6577!important}

  .card{margin:0 0 5px;border-color:#d7dbe2;border-radius:6px;break-inside:auto;overflow:visible!important}
  .card-h{padding:4px 8px;background:#f8f9fb!important}
  .card-h h2{font-size:11.5px;gap:5px}
  .card-h .meta{font-size:9px}
  .pill{font-size:8.5px;padding:0 5px}

  .card-b{padding:7px 9px}
  .sub-head{font-size:10px;margin:5px 0 2px}
  table{font-size:10.5px}
  th,td{padding:3px 5px}
  th{background:#f8f9fb!important}
  tr,li{break-inside:avoid}

  .alert{font-size:9.5px;padding:4px 7px;margin-top:3px;gap:4px;line-height:1.35}
  .p531-brief{font-size:9.5px;padding:4px 7px;gap:6px;margin:5px 0}
  .hint{font-size:9px;margin-top:2px}
  .f1-note{font-size:9px;margin-top:4px}

  /* F1 / F3 内部块也压缩，避免多页 */
  .f1-block{margin-bottom:5px}
  .f1-block-h{padding:4px 8px}
  .f1-block-b{padding:5px 8px 6px}
  .f1-desc{font-size:9px;margin-bottom:4px}
  .f1-line{margin-bottom:3px}
  .f3-grid{gap:4px;margin-bottom:6px}
  .f3-card{padding:4px 6px}
  .f3-card .s{font-size:13px;margin:0 0 3px}
  .lec-head{padding:4px 8px;margin-bottom:5px;gap:12px}
  .proof-grid{grid-template-columns:repeat(4,1fr);gap:5px}
  .proof-thumb{height:66px}
}

code{background:#f1f3f5;padding:1px 5px;border-radius:4px;font-size:12px;
  font-family:ui-monospace,Menlo,Consolas,monospace}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";display:inline-block;transition:.15s}
details[open] summary::before{content:"▾ "}
textarea{resize:vertical;line-height:1.6}


/* F1 专用 */
.f1-block{border:1px solid var(--line);border-radius:10px;margin-bottom:11px;overflow:hidden;background:#fff}
.f1-block-h{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 13px;background:#f8f9fb;border-bottom:1px solid var(--line)}
.f1-block-h .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.f1-block-h .k{display:inline-block;background:#e8eefc;color:var(--primary);font-size:11px;
  padding:2px 7px;border-radius:5px;font-weight:700;letter-spacing:.4px}
.f1-block-h .s{display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.f1-block-h .s b{font-size:15px;font-weight:650}
.f1-block-h .of{font-size:11px;color:#b9c0cb}
.mini{font-size:11px;padding:1px 6px;border-radius:4px;font-weight:600}
.mini.up{background:#e8f7ee;color:#17824d}
.mini.down{background:#fdecec;color:#c23b3b}
.f1-block-b{padding:11px 13px 13px}
.f1-desc{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:11px}
.base-tag{display:inline-block;margin-left:7px;font-size:10.5px;color:#8a93a3;
  background:#f1f3f6;padding:1px 6px;border-radius:4px}
.f1-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px 16px}
.f1-cols .field input{max-width:330px}
.f1-sub{font-size:11.5px;font-weight:600;color:#5c6675;margin:14px 0 7px;
  padding-left:7px;border-left:2px solid #ccd4e0}
.f1-cols + .f1-sub{margin-top:14px}
.f1-line{display:grid;grid-template-columns:minmax(170px,420px) 92px auto;justify-content:start;gap:8px;align-items:center;margin-bottom:7px}
.f1-line select,.f1-line input{max-width:100%}
.f1-line input{padding:5px 8px}
.f1-line select,.f1-line button{font-size:12.5px;padding:5px 8px}
.f1-empty{font-size:12px;color:#9aa2b0;padding:3px 0 1px}
.f1-opts{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
.f1-note{font-size:11.5px;color:#7d8697;margin-top:10px;padding:7px 9px;
  background:#fafbfc;border-radius:6px;line-height:1.5}
.f1-sum{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.f1-sum .f1-sub{margin-top:0}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
th{white-space:nowrap}
.note-cell{white-space:normal;min-width:190px;font-size:11.5px;color:#6d7684;line-height:1.5}
tr.sum-row td{background:#f7f9ff;border-top:1px solid #dfe6f5}
.field label{line-height:1.4}


/* B3 讲座记录 */
.lec-head{display:flex;gap:22px;flex-wrap:wrap;padding:11px 13px;margin-bottom:11px;
  background:#f7f9fd;border:1px solid #e2e9f7;border-radius:9px}
.lec-stat{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums}
.lec-stat .lab{font-size:11.5px;color:var(--muted);margin-right:2px}
.lec-stat b{font-size:17px;font-weight:650;letter-spacing:-.3px}
.lec-stat b.pts{color:var(--primary)}
.lec-stat .unit{font-size:11.5px;color:#9aa2b0}
.lec-row{display:grid;grid-template-columns:26px 140px 1fr auto;gap:8px;align-items:center;margin-bottom:6px}
.lec-row .lec-no{font-size:11.5px;color:#a8b0bd;text-align:right;font-variant-numeric:tabular-nums}
.lec-row input{padding:5px 8px;font-size:12.5px}
.lec-row button{padding:3px 8px;font-size:12px}
@media (max-width:560px){
  .lec-head{gap:14px}
  .lec-row{grid-template-columns:22px 1fr auto;row-gap:5px}
  .lec-row input[type=date]{grid-column:2/3}
  .lec-row input[type=text]{grid-column:2/4}
  .lec-row button{grid-column:3/4;grid-row:1/2}
}





/* 5531 指标 */
.p531-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:13px 15px;border-radius:11px;background:#fdf6ec;border:1px solid #f4e3c8;margin-bottom:11px}
.p531-top.ok{background:#edf9f2;border-color:#cfeadd}
.p531-title{font-size:14.5px;font-weight:650;margin-bottom:3px}
.p531-sub{font-size:12px;color:#6b7381;line-height:1.5}
.p531-chip{display:flex;gap:5px}
.p531-chip span{display:inline-block;padding:3px 9px;border-radius:6px;background:#fff;
  font-size:12px;font-variant-numeric:tabular-nums;color:#4a5566;border:1px solid rgba(0,0,0,.06)}
.p531-item{border:1px solid var(--line);border-radius:11px;margin-bottom:11px;background:#fff;overflow:hidden}
.p531-item.done{border-color:#cfeadd}
.p531-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 13px 8px}
.p531-name{font-weight:600;font-size:13.5px}
.p531-cnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.p531-cnt b{font-size:15.5px;color:var(--text);font-weight:650}
.p531-cnt .tick{color:#17824d;font-weight:600;margin-left:7px;font-size:12px}
.p531-bar{height:4px;background:#edf0f5;margin:0 13px;border-radius:2px;overflow:hidden}
.p531-bar i{display:block;height:100%;background:#c4cbda;border-radius:2px;transition:width .3s}
.p531-item.done .p531-bar i{background:#41a570}
.p531-body{padding:11px 13px 13px}
.p531-note{font-size:11.5px;color:#7d8697;margin-top:9px;padding:7px 9px;background:#fafbfc;
  border-radius:6px;line-height:1.5}
.p531-note b{color:var(--primary)}
.vol-row{grid-template-columns:26px 150px 82px 1fr auto!important}
.badge-dot.ok-dot{background:#e8f7ee;color:#17824d}
.p531-brief{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;
  border-radius:9px;background:#f7f9fd;border:1px solid #e2e9f7;font-size:12.5px}
.p531-brief .st{color:#5c6675}
.p531-brief .go{margin-left:auto}
@media (max-width:560px){
  .vol-row{grid-template-columns:22px 1fr auto!important;row-gap:5px}
  .vol-row select{grid-column:2/4}
  .vol-row input[type=number]{grid-column:2/3}
  .p531-top{padding:11px 12px}
}




/* F3 子标签 */
.f3-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.f3-card{text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:#fff;cursor:pointer;transition:.15s;font:inherit;color:inherit}
.f3-card:hover{border-color:#c6ccd6;background:#fbfcfd}
.f3-card.on{border-color:var(--primary);background:#f5f8ff;box-shadow:0 0 0 2px rgba(47,107,255,.09)}
.f3-card .h{font-size:11.5px;color:#6b7381;display:flex;align-items:baseline;gap:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f3-card .h b{color:var(--primary);font-size:11px;font-weight:700}
.f3-card .s{font-size:17px;font-weight:650;letter-spacing:-.3px;margin:2px 0 6px;
  font-variant-numeric:tabular-nums}
.f3-card .s span{font-size:11px;color:#a8b0bd;font-weight:400;margin-left:1px}
.f3-card .b{height:3px;background:#edf0f5;border-radius:2px;overflow:hidden}
.f3-card .b i{display:block;height:100%;background:#c9d4ea;border-radius:2px;transition:width .25s}
.f3-card.on .b i{background:var(--primary)}
.f3-card.full .b i{background:#41a570}
.f3-cur{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 0 12px;
  margin-bottom:14px;border-bottom:1px solid var(--line)}
.f3-cur .k{background:#e8eefc;color:var(--primary);font-size:11px;font-weight:700;
  padding:2px 7px;border-radius:5px;letter-spacing:.4px}
.f3-cur .n{font-size:14px;font-weight:650}
.f3-cur .d{font-size:12px;color:var(--muted)}
.f3-cur .p{margin-left:auto;font-size:11.5px;color:#8a93a3;background:#f4f6f9;
  padding:2px 8px;border-radius:5px}
@media (max-width:700px){.f3-grid{grid-template-columns:repeat(2,1fr)}}


.toolbar a.btn-a{display:inline-block;padding:7px 13px;border:1px solid var(--line);border-radius:8px;
  background:#fff;color:var(--text);text-decoration:none;transition:.15s;white-space:nowrap}
.toolbar a.btn-a:hover{border-color:#c6ccd6;background:#fbfcfd}
@media print{.toolbar a.btn-a{display:none!important}}





/* 证明材料 */
.proof-drop{border:2px dashed #d3dae5;border-radius:12px;padding:24px 16px;text-align:center;
  background:#fafbfd;cursor:pointer;transition:.15s;margin-bottom:14px;font-size:14.5px;
  font-weight:550;color:#414a58;user-select:none}
.proof-drop:hover,.proof-drop.over{border-color:var(--primary);background:#f5f8ff;color:var(--primary)}
.proof-drop .hint{font-weight:400;margin-top:5px;font-size:11.5px}
.proof-sum{font-size:12.5px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;
  flex-wrap:wrap;gap:4px}
.proof-sum b{color:var(--text);font-variant-numeric:tabular-nums}
.proof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(166px,1fr));gap:12px}
.proof-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;
  display:flex;flex-direction:column}
.proof-thumb{height:112px;background:#f1f3f6;cursor:zoom-in;overflow:hidden;position:relative}
.proof-thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .2s}
.proof-body{padding:8px 9px;display:flex;flex-direction:column;gap:6px}
.proof-body input,.proof-body select{font-size:12px;padding:4px 7px}
.proof-meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#9aa2b0}
.proof-meta button{padding:2px 7px;font-size:11.5px}
.proof-mini{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:13px;
  border-top:1px dashed var(--line)}
.proof-mini img{width:52px;height:52px;object-fit:cover;border-radius:6px;cursor:zoom-in;
  border:1px solid var(--line);background:#f1f3f6;transition:.15s}
.proof-mini img:hover{border-color:var(--primary);transform:scale(1.04)}
.lightbox{position:fixed;inset:0;background:rgba(12,16,24,.88);display:flex;align-items:center;
  justify-content:center;z-index:200;padding:20px}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:84vh;border-radius:8px;box-shadow:0 12px 44px rgba(0,0,0,.45)}
.lb-close{position:absolute;top:14px;right:16px;background:rgba(255,255,255,.14);border:none;
  color:#fff;font-size:17px;width:38px;height:38px;border-radius:50%;cursor:pointer;line-height:1}
.lb-close:hover{background:rgba(255,255,255,.26)}
.lb-cap{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;
  font-size:12.5px;background:rgba(0,0,0,.5);padding:5px 13px;border-radius:6px;
  max-width:82%;text-align:center;line-height:1.5}
@media (max-width:560px){
  .proof-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .proof-thumb{height:94px}
}

<script>





















const RULES = {
  F1_ITEMS:[
    {key:'A1',name:'思想政治表现',base:17,desc:'坚定政治方向、拥护党的领导、爱国守法、参加政治学习，计17分'},
    {key:'A2',name:'道德品质修养',base:20,desc:'践行核心价值观、维护公德、诚实守信、热心公益等，计20分'},
    {key:'A3',name:'学习态度作风',base:20,desc:'态度端正、不旷课迟到、无舞弊，计20分'},
    {key:'A4',name:'组织纪律观念',base:20,desc:'遵守法律法规与校规校纪、集体荣誉、宿舍安全，计20分'},
    {key:'A5',name:'身心健康素质',base:20,desc:'积极锻炼、心理健康、完成军训及国防教育，计20分'}
  ],
  T1:[
    {type:'团校、青马学习小组',roles:[{r:'组长',s:2},{r:'组员',s:1}]},
    {type:'入党积极分子培训班',roles:[{r:'组长',s:3},{r:'组员',s:2}]},

  ],

  A3:{away:5,late:3,task:2,leave:1,leaveFrom:5},

  A5_ABSENT:3, ITEM_CAP:20,
  B_CAP:{B1:20,B2:20,B3:20,B4:20,B5:20,B6:20,B7:20,B8:20},
  /* 总则第 2 条：综测总分满分 100 分 → F1/F2/F3 均按百分制，F3 各项上限 20、合计封顶 100 */

  B1_CERTS:[

    {n:'GYB创业培训',s:1},

  ],
  B1_SKILL_BASE:5, B1_CERT_EXCELLENT:1,
  B1_CET4:[[650,3],[600,2],[550,1]],
  B1_CET6:[[600,3],[550,2],[500,1]],
  /* 表2：雅思/托福/GRE 等归入 4 分档（base）；雅思≥7、托福≥100 再 +2（bonus） */
  B1_LANG:{ielts:{min:5.5,hi:7,bonus:2,base:4},toefl:{min:80,hi:100,bonus:2,base:4}},
  B2_LEVELS:['国家级','省（部）级','校级','部级'],
  B2_ROWS:[['特等奖',20,15,8,5],['一（金奖）',15,10,6,3],['二（银奖）',12,8,4,2],['三（铜奖）',9,5,2,1],['优秀奖、鼓励奖、入围奖',5,2,1,0.5]],
  B2_JOIN:3,
  B2_ROLE:[{r:'第一负责人',k:1},{r:'第二、三负责人',k:0.5},{r:'其余团队成员',k:0.25}],
  B3_LEVELS:['国家级','省（部）级','市级','校级','部级'],
  B3_ROWS:[['特等奖',20,15,10,8,5],['一（金奖）',15,10,8,6,3],['二（银奖）',12,8,6,4,2],['三（铜奖）',9,5,4,2,1],['优秀奖、鼓励奖、入围奖',5,2,1.5,1,0.5]],
  B3_PROJECT:[15,10,6,4,2], B3_PATENT:15, B3_ACT_PER:0.5, B3_ACT_CAP:10,
  B3_JOURNALS:['校定权威/重要、SCI/EI/SSCI','核心期刊','一般期刊','合法的内部学术刊物'],
  B3_PAPER_ROWS:[['独著',30,12,8,4],['合著（第一作者）',20,8,6,2],['合著（第二、三作者）',10,4,3,1],['合著（第四、五作者）',5,2,1.5,0.5]],
  B3_BOOK_SIZES:['学术著作 10万字以上','学术著作 10万字以下','文学艺术 10万字以上','文学艺术 5万字以上','文学艺术 1万字以上','文学艺术 1万字以下'],
  B3_BOOK_ROWS:[['独著',30,10,30,20,12,8],['合著',20,8,10,5,3,2],['主编',20,8,10,5,3,2],['参编',12,5,6,3,2,1]],
  B4_MEDIA:['其他国家级媒体','大学生在线','省级媒体','地级市公开发行媒体','校网/新闻网/校报','星网/翔网/心扉报','医学部部网','医学生报纸/杂志/微信/海报','医学部广播站播音稿'],
  B4_FIRST:[8,7,5,3,3,2,1.5,1,0.5],
  B4_SECOND:[6,6,3,2,2,1,1,0.5,0],
  B4_ESSAY:1, B4_ESSAY_AWARD:2, B4_ESSAY_CAP:5, B4_WEB_CAP:15, B4_SPECIAL_CAP:15,
  B5_COLS:['校/部团委副书记、学生会主席等','校/部副主席、年级主席、年级团副','部门负责人、社团理事长、党支部书记等','部门副部长、社团副理事长、年级副主席、综测负责人','班长、团支书、年级部长、学生助理、宿管会副部长','部门干事、学习/心理/组织/宣传委员等班干','朋辈心理辅导员、寝室长'],
  B5_ROWS:[['优秀',10,9,8,6,5,4,2],['良好',9,8,7,5,4,3,1],['合格',8,7,6,4,3,2,0]],
  B5_HALF_TERM:0.5, B5_LEADER:5, B5_MEMBER:3,
  B6_LEVELS:['国家级','省（部）级','校级','部级','年级','班级（社团）'],
  B6_ROWS:[['社会实践团队-负责人',6,4,3,2.5,1.5,1],['社会实践团队-成员',4,2,1.5,1.5,1,0.5],['优秀团队-负责人',8,6,4,3,2,1.5],['优秀团队-成员',4,3,2.5,2,1,0.5],['先进个人、积极分子',8,6,4,3,2,1.5],['调研报告、实践报告获奖',8,6,4,3,2,1.5],['表彰或书面表扬',8,6,4,3,2,1.5]],
  B6_TEAM:{leader:2,member:1,once:0.5,cap:5},
  B6_SANXIA:{leader:14,member:12},
  B6_VOL_LEVELS:['小组志愿活动','部级志愿活动','项目活动','片区志愿活动','校级及以上志愿活动'],
  B6_VOL_RATE:[0.2,0.4,0.5,0.8,1],
  B6_VOL_CAP:10,
  B6_HONOR_COLS:['校级“十佳”','校级表彰','部级“十佳”','部级表彰'],
  B6_HONOR_ROWS:[['团队负责人',4,3,3,2],['团队成员',3,2,2,1],['个人',4,3,3,2]],
  B6_HONOR_CAP:10,
  /* 毅行/益跑/马拉松等运动项目 3 分/次，合计上限 6 分，半程按 0.5 次计 */
  B6_SPORT:3, B6_BLOOD:2, B6_BLOOD_CAP:4, B6_SPORT_CAP:6, B6_HALF:0.5,
  B7_LEVELS:['国家级','省（部）级','校级','部级','社团、年级'],
  B7_ROWS:[['集体奖-一等奖',10,8,6,4,2],['集体奖-二等奖',8,6,4,2,1],['集体奖-三等奖',6,5,3,1,0.5],['个人奖-一等奖',8,6,5,3,1.5],['个人奖-二等奖',6,5,4,2,1],['个人奖-三等奖',5,4,3,1,0.5],['优秀奖/入围奖/纪念奖',4,3,2,0.5,0.5]],
  /* B7 团队：队长与副队长（每队最多 2 名）计满分，其余按 50% */
  B7_ACT_PER:0.5, B7_ACT_CAP:5,
  B7_ROLES:['队长 / 副队长（每队最多 2 名）','其余成员'],
  B7_ROLE_K:[1,0.5],
  B8_LEVELS:['市级','社区','校级','部级'],
  B8_ROWS:[['劳动活动 1h以上/次',2,1.5,1,0.5],['劳动活动 1h以内/次',1.5,1,0.5,0.3],['荣誉-优秀寝室',2,1.5,1,0.5],['荣誉-优秀个人',4,2,1,0.5]],
  WEIGHT:{F1:0.10,F2:0.65,F3:0.25},
  GRADE_MAP:{'优':95,'良':85,'中':75,'及格':65,'不及格':50},
  /* 细则第二章：F2 只计专业必修、公共必修、专业选修，不含校公选课与辅修课程 */
  COURSE_TYPES:['专业必修','公共必修','专业选修','其他','校公选（不计入）','辅修（不计入）'],
  COURSE_EXCLUDED:/不计入/,
  /* 百分制成绩 → 绩点（校方换算表）：100-95→5.0，94-90→4.5 … 59-0→0 */
  GPA_ROWS:[['100~95',5.0],['94~90',4.5],['89~85',4.0],['84~80',3.5],['79~75',3.0],['74~70',2.5],['69~65',2.0],['64~60',1.5],['59~0',0]],
  GPA_BANDS:[[95,5.0],[90,4.5],[85,4.0],[80,3.5],[75,3.0],[70,2.5],[65,2.0],[60,1.5],[0,0]]
};

/* 成绩 → 绩点（与 GPA_ROWS 一一对应） */
function gpaOf(score){
  const s = parseFloat(score);
  if(!isFinite(s) || s <= 0) return 0;
  for (const [min, pt] of RULES.GPA_BANDS){
    if(s >= min) return pt;
  }
  return 0;
}

const NUM = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const R1 = n => Math.round(n*10)/10;
const R2 = n => Math.round(n*100)/100;

/* "5531" 指标：3 讲座 + 5 志愿 + 5 文体 + 1 成长辅导 */
function check5531(stu){
  const lec = Array.isArray(stu.B3 && stu.B3.lectures) ? stu.B3.lectures.length : 0;
  const vol = Array.isArray(stu.B6 && stu.B6.vols) ? stu.B6.vols.length : 0;
  const spo = Array.isArray(stu.B7 && stu.B7.activityList) ? stu.B7.activityList.length : 0;
  const gro = Array.isArray(stu.B6 && stu.B6.growth) ? stu.B6.growth.length : 0;
  const need = {lec:3, vol:5, spo:5, gro:1};
  return {
    lec:lec, vol:vol, spo:spo, gro:gro, need:need,
    auto: lec>=3 && vol>=5 && spo>=5 && gro>=1,
    manual: !!(stu && stu.has5531)
  };
}

const ENGINE = {
  f1(stu){
    const items = stu.F1 || {}; const parts = [];
    for (const it of RULES.F1_ITEMS){
      const d = items[it.key] || {};
      let plus=0, minus=0, zero=false; const notes=[];
      if (it.key==='A1'){
        let best=0, bn='';
        for (const t of (d.trainings||[])){
          const def = RULES.T1.find(x=>x.type===t.type);
          if(!def) continue;
          const role = def.roles.find(r=>r.r===t.role);
          if(role && role.s>best){ best=role.s; bn=t.type+'/'+t.role; }
        }
        plus = Math.min(best, RULES.T1_CAP);
        if(best>0) notes.push('团校/青马 '+bn+' = '+plus+'分（取最高、上限3分）');
        const ab=NUM(d.absent); if(ab){ minus+=ab*RULES.A1_ABSENT; notes.push('无故缺席政治学习 '+ab+'次 = -'+(ab*5)); }
        if(d.fail){ zero=true; notes.push('团校/青马不合格 → 本项0分'); }
      }
      if (it.key==='A2'){
        const a=NUM(d.badDeed), b=NUM(d.badHouse);
        if(a){ minus+=a*RULES.A2_BADDEED; notes.push('不良行为 '+a+'次 = -'+(a*5)); }
        if(b){ minus+=b*RULES.A2_BADHOUSE; notes.push('差寝 '+b+'次 = -'+(b*5)); }
      }
      if (it.key==='A3'){
        const away=NUM(d.away), late=NUM(d.late), task=NUM(d.task), leave=NUM(d.leave);
        if(away){ minus+=away*RULES.A3.away; notes.push('旷课 '+away+'次 = -'+(away*5)); }
        if(late){ minus+=late*RULES.A3.late; notes.push('迟到早退 '+late+'次 = -'+(late*3)); }
        if(task){ minus+=task*RULES.A3.task; notes.push('未完成学习任务 '+task+'次 = -'+(task*2)); }
        const over = leave - RULES.A3.leaveFrom;
        if(over>0){ minus+=over*RULES.A3.leave; notes.push('事病假 '+leave+'次，超出5次 '+over+'次 = -'+over); }
        if(d.cheat){ zero=true; notes.push('考试舞弊 → 本项0分'); }
      }
      if (it.key==='A4'){
        for (const p of (d.punish||[])){
          const def = RULES.A4.find(x=>x.t===p.type);
          const c = NUM(p.count);
          if(!def || !c) continue;
          minus+=c*def.s; notes.push(def.t+' '+c+'次 = -'+(c*def.s));
        }
      }
      if (it.key==='A5'){
        const ab=NUM(d.absent);
        if(ab){ minus+=ab*RULES.A5_ABSENT; notes.push('无故缺席 '+ab+'次 = -'+(ab*3)); }
      }
      const deduct = Math.min(minus, RULES.ITEM_CAP);
      if(minus>RULES.ITEM_CAP) notes.push('扣分累计 '+minus+'，按单项上限20计');
      let score = zero ? 0 : it.base + plus - deduct;
      score = Math.max(0, Math.min(20, score));
      parts.push({key:it.key,name:it.name,base:it.base,plus,deduct:zero?0:deduct,score:R1(score),notes});
    }
    let F1 = parts.reduce((s,p)=>s+p.score,0);
    const veto = !!stu.veto;
    if(veto) F1 = 0;
    return {F1:R1(F1), parts, veto};
  },

  f2(courses){
    let sw=0, ssw=0, sgp=0;
    for (const c of (courses||[])){
      if(RULES.COURSE_EXCLUDED.test(String(c.type||''))) continue;
      const credit=NUM(c.credit);
      let score = c.grade ? (RULES.GRADE_MAP[c.grade]||0) : NUM(c.score);
      if(credit<=0 || score<=0) continue;
      sw+=credit; ssw+=credit*score; sgp+=credit*gpaOf(score);
    }
    return {F2: sw>0 ? R1(ssw/sw) : 0, credit:R1(sw), weighted:R1(ssw),
            gpa: sw>0 ? R2(sgp/sw) : 0, points:R2(sgp)};
  },

  /* 平均学分绩点：Σ(学分×绩点) ÷ Σ学分，逐门明细供绩点页使用 */
  gpa(courses){
    const rows=[]; let sw=0, sp=0;
    for (const c of (courses||[])){
      const type = String(c.type||'');
      if(RULES.COURSE_EXCLUDED.test(type)) continue;
      const credit=NUM(c.credit);
      const score = c.grade ? (RULES.GRADE_MAP[c.grade]||0) : NUM(c.score);
      if(credit<=0 || score<=0) continue;
      const gp = gpaOf(score);
      sw+=credit; sp+=credit*gp;
      rows.push({name:c.name||'（未命名课程）', type:type, credit:credit, score:score,
                 grade:c.grade||'', gp:gp, weighted:R2(credit*gp)});
    }
    return {gpa: sw>0 ? R2(sp/sw) : 0, credits:R1(sw), points:R2(sp), rows:rows};
  },

  f3(stu){
    const B={}; const detail={B1:[],B2:[],B3:[],B4:[],B5:[],B6:[],B7:[],B8:[]};
    const hasBase = !!(stu.has5531 || check5531(stu).auto);
    const baseOf = k => (hasBase && RULES.B_BASE_KEYS.indexOf(k)>=0) ? RULES.B_BASE : 0;
    const push = (k, arr) => arr.forEach(t=>detail[k].push(t));

    // B1
    {
      const d = stu.B1||{}; let s=0; const L=[];
      if(d.skillBase){ s+=RULES.B1_SKILL_BASE; L.push('职业技能培训参与 +5'); }
      const seenCert = {};
      for (const c of (d.certs||[])){
        const idx = NUM(c.idx);
        const def = RULES.B1_CERTS[idx];
        if(!def || seenCert[idx]) continue;   // 同一项目只计一次（取最高分）
        seenCert[idx] = true;
        s+=def.s; L.push(def.n.split(' / ')[0]+' +'+def.s);
      }
      if(d.certExcell){ s+=RULES.B1_CERT_EXCELLENT; L.push('国二证书评级优秀 +'+RULES.B1_CERT_EXCELLENT); }
      if(NUM(d.cet4)){ const v=NUM(d.cet4); for(const [th,add] of RULES.B1_CET4){ if(v>=th){ s+=add; L.push('四级 '+v+' 额外 +'+add); break; } } }
      if(NUM(d.cet6)){ const v=NUM(d.cet6); for(const [th,add] of RULES.B1_CET6){ if(v>=th){ s+=add; L.push('六级 '+v+' 额外 +'+add); break; } } }
      for (const k of ['ielts','toefl']){
        const v=NUM(d[k]); if(!v) continue;
        const cfg=RULES.B1_LANG[k], nm=(k==='ielts'?'雅思':'托福');
        if(v>=cfg.min){
          s+=cfg.base; L.push(nm+' '+v+' +'+cfg.base);
          if(v>=cfg.hi){ s+=cfg.bonus; L.push(nm+'≥'+cfg.hi+' 再+'+cfg.bonus); }
        }
      }
      const raw = baseOf('B1')+s;
      B.B1={raw:R2(raw), base:baseOf('B1'), score:R2(Math.min(raw,RULES.B_CAP.B1))};
      push('B1',L);
    }
    // B2
    {
      const d = stu.B2||{}; let s=0; const L=[];
      if(d.join){ s+=RULES.B2_JOIN; L.push('参与学科竞赛 +3'); }
      for (const e of (d.awards||[])){
        const row=RULES.B2_ROWS[NUM(e.row)]; const col=NUM(e.col);
        if(!row || isNaN(col) || col<0) continue;
        const k = d.teamMode ? RULES.B2_ROLE[NUM(e.role)].k : 1;
        const v = row[col+1]*k; s+=v;
        L.push(row[0]+' / '+RULES.B2_LEVELS[col]+(k!==1?'（'+RULES.B2_ROLE[NUM(e.role)].r+'×'+k+'）':'')+' +'+R2(v));
      }

      for (const e of (d.awards||[])){

    // B4

      if(d.leader){ s+=RULES.B5_LEADER; L.push('综测小组长 +5'); }
      if(d.member){ s+=RULES.B5_MEMBER; L.push('综测小组成员 +3'); }

      B.B5={raw:R2(raw), base:baseOf('B5'), score:R2(Math.min(raw,RULES.B_CAP.B5))};
      push('B5',L);
    }
    // B6
    {
      const d = stu.B6||{}; let s=0; const L=[];

      const sportCnt = NUM(d.sport) || (d.yixing ? 1 : 0);

      const raw = baseOf('B6')+s;
      B.B6={raw:R2(raw), base:baseOf('B6'), score:R2(Math.min(raw,RULES.B_CAP.B6))};
      push('B6',L);
    }
    // B7
    {
      const d = stu.B7||{}; let s=0; const L=[];
      for (const e of (d.awards||[])){
        const row=RULES.B7_ROWS[NUM(e.row)]; const col=NUM(e.col);
        if(!row || isNaN(col) || col<0) continue;
        const ri = NUM(e.role);
        const k = d.teamMode ? (RULES.B7_ROLE_K[ri]!=null?RULES.B7_ROLE_K[ri]:0.5) : 1;
        const v = row[col+1]*k; s+=v;
        L.push(row[0]+' / '+RULES.B7_LEVELS[col]+(k!==1?'（其余成员×50%）':'')+' +'+R2(v));
      }
      const spoArr = Array.isArray(d.activityList) ? d.activityList : [];
      const spoCount = Array.isArray(d.activityList) ? spoArr.length : Math.max(0, Math.floor(NUM(d.activities)));
      const act = Math.min(spoCount*RULES.B7_ACT_PER, RULES.B7_ACT_CAP);
      if(act){ s+=act; L.push('文体活动 '+spoCount+' 次 ×0.5 = +'+R2(act)+'（上限5）'); }
      const raw = baseOf('B7')+s;
      B.B7={raw:R2(raw), base:baseOf('B7'), score:R2(Math.min(raw,RULES.B_CAP.B7))};
      push('B7',L);
    }
    // B8
    {
      const d = stu.B8||{}; let s=0; const L=[];
      for (const e of (d.items||[])){
        const row=RULES.B8_ROWS[NUM(e.row)]; const col=NUM(e.col);
        if(!row || isNaN(col) || col<0) continue;
        const v = row[col+1]*NUM(e.times||1);
        s+=v; L.push(row[0]+' / '+RULES.B8_LEVELS[col]+' ×'+NUM(e.times||1)+' = +'+R2(v));
      }
      const raw = baseOf('B8')+s;
      B.B8={raw:R2(raw), base:baseOf('B8'), score:R2(Math.min(raw,RULES.B_CAP.B8))};
      push('B8',L);
    }

    let F3=0; for(const k in B) F3+=B[k].score;
    F3 = Math.min(F3, RULES.F3_CAP);
    return {F3:R2(F3), B, detail};
  },

  total(stu){
    const f1=this.f1(stu), f2=this.f2(stu.courses), f3=this.f3(stu);
    const t = f1.F1*RULES.WEIGHT.F1 + f2.F2*RULES.WEIGHT.F2 + f3.F3*RULES.WEIGHT.F3;
    const failCourse = (stu.courses||[]).some(c=>{
      const sc = c.grade ? RULES.GRADE_MAP[c.grade] : NUM(c.score);
      return sc>0 && sc<60;
    });
    /* “5531”指标：自动达标与手动认定二者之一即可（细则总则第 3 条） */
    const s5 = check5531(stu);
    const has5531 = !!(stu.has5531 || s5.auto);
    return {
      F1:f1.F1, F2:f2.F2, F3:f3.F3, total:R2(t),
      parts:f1.parts, veto:f1.veto, B:f3.B, detail:f3.detail, credit:f2.credit,

      failCourse, s5531:s5, has5531, no5531:!has5531,
      qualified: !f1.veto && has5531 && !failCourse,
      grade: t>=90?'优秀':t>=80?'良好':t>=70?'中等':t>=60?'合格':'不合格'
    };
  }
};

/* 解析批量粘贴文本 */
function parseBulk(text){
  const lines = String(text||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const out = [];
  for (const line of lines){
    const parts = line.split(/[,\t，;；]+/).map(s=>s.trim()).filter(s=>s!=='');
    if (parts.length >= 3){
      out.push({name:parts[0], credit:parseFloat(parts[1]), score:parseFloat(parts[2])});
    } else if (parts.length === 2){
      out.push({name:parts[0], credit:NaN, score:parseFloat(parts[1])});
    } else {
      const m = line.match(/^(.*?)[\s]+(\d+(?:\.\d+)?)(?:[\s]+(\d+(?:\.\d+)?))?$/);
      if (m && m[1].trim()){
        if (m[3] !== undefined) out.push({name:m[1].trim(), credit:parseFloat(m[2]), score:parseFloat(m[3])});
        else out.push({name:m[1].trim(), credit:NaN, score:parseFloat(m[2])});
      } else {
        out.push({name:line, credit:NaN, score:NaN});
      }
    }
  }
  return out;
}

/* 兼容旧数据：B3.lectures 由"次数"迁移为"逐条记录" */
function migrate(s){
  if(!s || !s.B3) return s;
  if(!Array.isArray(s.B3.lectures)){
    const n = Math.max(0, Math.floor(parseFloat(s.B3.lectures) || 0));
    const arr = [];
    for(let i=0;i<n;i++) arr.push({date:'', name:''});
    s.B3.lectures = arr;
  }
  if(s.B7 && !Array.isArray(s.B7.activityList)){
    const n = Math.max(0, Math.floor(parseFloat(s.B7.activities) || 0));
    const arr = [];
    for(let i=0;i<n;i++) arr.push({date:'', name:''});
    s.B7.activityList = arr;
  }
  if(s.B6 && !Array.isArray(s.B6.growth)) s.B6.growth = [];
  /* 毅行由布尔值改为“运动项目次数”：旧数据勾选记为 1 次 */
  if(s.B6 && s.B6.yixing && !parseFloat(s.B6.sport)) s.B6.sport = 1;
  if(s.B6) s.B6.yixing = false;
  if(!Array.isArray(s.proofs)) s.proofs = [];

  /* 修复历史数据：下拉框曾存索引，现按文字匹配 */
  const isIdx = function(v){ return /^\d+$/.test(String(v == null ? '' : v)); };
  if(s.F1 && s.F1.A1 && Array.isArray(s.F1.A1.trainings)){
    s.F1.A1.trainings.forEach(function(t){
      if(isIdx(t.type)){ const r = RULES.T1[parseInt(t.type)]; if(r) t.type = r.type; }
      if(isIdx(t.role)){ t.role = (String(t.role) === '0') ? '组长' : '组员'; }
    });
  }
  if(s.F1 && s.F1.A4 && Array.isArray(s.F1.A4.punish)){
    s.F1.A4.punish.forEach(function(p){
      if(isIdx(p.type)){ const r = RULES.A4[parseInt(p.type)]; if(r) p.type = r.t; }
    });
  }
  if(s.B5 && Array.isArray(s.B5.posts)){
    s.B5.posts.forEach(function(p){
      if(isIdx(p.level)){ p.level = ['优秀','良好','合格','不合格'][parseInt(p.level)] || '合格'; }
    });
  }
  /* B7 团队角色：旧数据沿用 B2 的三角色索引（0/1 = 队长副队长，2 = 其余成员） */
  if(s.B7 && Array.isArray(s.B7.awards)){
    s.B7.awards.forEach(function(a){
      const ri = parseInt(a.role);
      if(ri === 2) a.role = 1; else if(ri === 0 || ri === 1) a.role = 0;
    });
  }
  if(Array.isArray(s.courses)){
    s.courses.forEach(function(c){
      if(isIdx(c.type)){ c.type = RULES.COURSE_TYPES[parseInt(c.type)] || '专业必修'; }
    });
  }
  return s;
}

function loadState(){

    if(!raw) return false;
    const parsed = JSON.parse(raw);

    migrate(parsed);
    state = deepMerge(blankState(), parsed);
    return true;
  }catch(e){ console.warn('load failed', e); return false; }
}

function deepMerge(base, over){
  if(Array.isArray(base)) return Array.isArray(over) ? over : base;
  if(base && typeof base === 'object'){
    const out = {};
    for(const k of Object.keys(base)) out[k] = (over && k in over) ? deepMerge(base[k], over[k]) : base[k];
    for(const k of Object.keys(over||{})) if(!(k in out)) out[k] = over[k];
    return out;
  }
  return over === undefined ? base : over;
}

/* ============ 图片存储（IndexedDB，容量远大于 localStorage） ============ */
const IDB_NAME = 'zongce_media';
const IDB_STORE = 'files';
let _dbPromise = null;

function openDB(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise(function(resolve, reject){
    if(typeof indexedDB === 'undefined'){ reject(new Error('此浏览器不支持本地图片存储')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = function(e){
      const db = e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = function(e){ resolve(e.target.result); };
    req.onerror = function(e){ reject(e.target.error || new Error('无法打开本地数据库')); };
  });
  return _dbPromise;
}

function idbPut(key, val){
  return openDB().then(function(db){
    return new Promise(function(res, rej){
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(val, key);
      tx.oncomplete = function(){ res(); };
      tx.onerror = function(){ rej(tx.error); };
    });
  });
}
function idbGet(key){
  return openDB().then(function(db){
    return new Promise(function(res, rej){
      const tx = db.transaction(IDB_STORE, 'readonly');
      const rq = tx.objectStore(IDB_STORE).get(key);
      rq.onsuccess = function(){ res(rq.result); };
      rq.onerror = function(){ rej(rq.error); };
    });
  });
}
function idbDel(key){
  return openDB().then(function(db){
    return new Promise(function(res, rej){
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = function(){ res(); };
      tx.onerror = function(){ rej(tx.error); };
    });
  });
}

const _blobUrls = {};
function blobSrc(id, blob){
  if(_blobUrls[id]) return _blobUrls[id];
  const u = URL.createObjectURL(blob);
  _blobUrls[id] = u;
  return u;
}
function forgetBlob(id){
  if(_blobUrls[id]){ URL.revokeObjectURL(_blobUrls[id]); delete _blobUrls[id]; }
}

/* 压缩：长边超过 maxDim 时等比缩小，转为 JPEG */
function compressImage(file, maxDim, quality){
  return new Promise(function(resolve){
    if(!/^image\//.test(file.type) || /gif|svg/i.test(file.type)){ resolve(file); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function(){
      URL.revokeObjectURL(url);
      const w0 = img.naturalWidth, h0 = img.naturalHeight;
      if(Math.max(w0, h0) <= maxDim){ resolve(file); return; }
      const k = maxDim / Math.max(w0, h0);
      const w = Math.round(w0 * k), h = Math.round(h0 * k);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      cv.toBlob(function(b){ resolve(b || file); }, 'image/jpeg', quality);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

function blobToDataURL(blob){
  return new Promise(function(res, rej){
    const fr = new FileReader();
    fr.onload = function(){ res(fr.result); };
    fr.onerror = function(){ rej(fr.error); };
    fr.readAsDataURL(blob);
  });
}
function dataURLtoBlob(d){
  const i = String(d).indexOf(',');
  const head = String(d).slice(0, i);
  const mime = (head.match(/:(.*?);/) || [,'image/jpeg'])[1];
  const bin = atob(String(d).slice(i + 1));
  const arr = new Uint8Array(bin.length);
  for(let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
  return new Blob([arr], {type: mime});
}

function fmtSize(n){
  if(!n) return '0 B';
  if(n < 1024) return n + ' B';
  if(n < 1048576) return (n/1024).toFixed(0) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}

/* ============ 备份 ============ */
function download(filename, text){
  const blob = new Blob([text], {type:'application/json;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function backupPayload(){
  return Object.assign({}, state, {
    _appVersion: APP_VERSION,
    _exportedAt: new Date().toISOString()
  });
}
function doBackup(){
  const stamp = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const nm = (state.profile.name || '综测').trim();
  const n = (state.proofs || []).length;

  if(!n){
    download('综测备份_'+nm+'_'+stamp+'.json', JSON.stringify(backupPayload(), null, 2));
    toast('已导出备份文件（'+APP_VERSION+'）');
    return;
  }

  const withImg = confirm('当前有 ' + n + ' 张证明材料图片。\n\n点「确定」：连同图片一起导出（文件较大，可完整还原）\n点「取消」：只导出数据（图片不进备份，换设备会丢失）');
  if(!withImg){
    download('综测备份_'+nm+'_'+stamp+'.json', JSON.stringify(backupPayload(), null, 2));
    toast('已导出（仅数据）');
    return;
  }

  toast('正在打包图片…');
  const jobs = state.proofs.map(function(p){
    return idbGet(p.id).then(function(blob){
      if(!blob) return null;
      return blobToDataURL(blob).then(function(d){ return {id:p.id, data:d}; });
    }).catch(function(){ return null; });
  });

  Promise.all(jobs).then(function(arr){
    const pack = JSON.parse(JSON.stringify(state));
    pack._images = arr.filter(Boolean);
    pack._appVersion = APP_VERSION;
    pack._exportedAt = new Date().toISOString();
    download('综测完整备份_'+nm+'_'+stamp+'.json', JSON.stringify(pack));
    toast('已导出（含 ' + pack._images.length + ' 张图片）');
  }).catch(function(e){
    alert('导出失败：' + (e && e.message ? e.message : e));
  });
}
function doImport(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data !== 'object') throw new Error('格式不对');
      if(!data.F1 || !data.B1) throw new Error('缺少必要字段');
      if(!confirm('导入将覆盖当前所有数据，确定继续？')) return;
      const imgs = data._images || [];
      const fromVer = data._appVersion || '未标注版本';
      delete data._images;
      delete data._appVersion;
      delete data._exportedAt;
      migrate(data);
      state = deepMerge(blankState(), data);
      persist(); render();

      if(imgs.length){
        toast('正在还原图片…');
        const jobs = imgs.map(function(it){
          try{
            return idbPut(it.id, dataURLtoBlob(it.data));
          }catch(e){ return Promise.resolve(); }
        });
        Promise.all(jobs).then(function(){
          render();
          toast('导入成功（'+fromVer+'），含 ' + imgs.length + ' 张图片');
        }).catch(function(){
          toast('数据已导入，但图片还原失败');
        });
      } else {
        toast('导入成功（'+fromVer+'）');
      }
    }catch(e){
      alert('导入失败：'+(e.message||'文件不是有效的备份 JSON'));
    }
  };
  reader.readAsText(file, 'utf-8');
}

/* --- 通用：可重复列表 --- */
function repeatBlock(path, title, rowTpl, opts){
  opts = opts||{};
  const list = get(path, []) || [];
  const rows = list.map((item,i)=>'<div class="row-item" style="grid-template-columns:'+(opts.cols||'1fr 1fr 60px')+'">'+rowTpl(item,i)+'</div>').join('');
  return '<div class="sub-head">'+title+'</div>'+
    (rows || '<div class="empty">'+esc(opts.emptyText||'暂无记录')+'</div>')+
    '<div style="margin-top:8px"><button data-add="'+path+'">'+esc(opts.addLabel||'+ 添加一条')+'</button></div>';
}

function awardBlock(basePath, title, levels, rowsSpec, opts){
  opts = opts || {};
  const list = get(basePath+'.awards', []) || [];
  const teamMode = get(basePath+'.teamMode', false);
  const roles = opts.roleList || RULES.B2_ROLE.map(r=>r.r);
  const factors = opts.factors || RULES.B2_ROLE.map(r=>r.k);
  const rows = list.map((a,i)=>{
    const lvSel = '<select data-bind="'+basePath+'.awards.'+i+'.col">'+selectOpts(levels, a.col)+'</select>';
    const rwSel = '<select data-bind="'+basePath+'.awards.'+i+'.row">'+selectOpts(rowsSpec.map(r=>r[0]), a.row, null, null)+'</select>';
    let roleSel = '';
    if(teamMode){
      roleSel = '<select data-bind="'+basePath+'.awards.'+i+'.role">'+selectOpts(roles, a.role)+'</select>';
    }
    /* 下拉框存的是索引，预览必须按索引取值（旧代码按文字匹配，恒为 0 分） */
    const rowIdx = Number(a.row), colIdx = Number(a.col);
    let pts = 0;
    if(Number.isInteger(rowIdx) && rowIdx>=0 && rowIdx<rowsSpec.length &&
       Number.isInteger(colIdx) && colIdx>=0 && colIdx<levels.length){
      pts = rowsSpec[rowIdx][colIdx+1] || 0;
      if(teamMode && opts.roleFactor){
        const k = factors[Number(a.role)];
        pts *= (k==null ? 1 : k);
      }
    }
    return '<div class="row-item" style="grid-template-columns:1fr 120px 130px '+(teamMode?'140px ':'')+'70px 60px">'+
      rwSel+lvSel+(teamMode?roleSel:'')+
      '<input type="text" data-bind="'+basePath+'.awards.'+i+'.note" value="'+esc(a.note||'')+'" placeholder="项目名称/备注">'+
      '<div style="text-align:right;font-weight:600;color:var(--primary)">+'+Math.round(pts*100)/100+'</div>'+
      '<button class="tiny danger del" data-del="'+basePath+'.awards" data-idx="'+i+'">删除</button>'+
    '</div>';
  }).join('');
  return '<div class="sub-head">'+title+'</div>'+
    (opts.teamToggle?'<div class="grid" style="margin-bottom:10px">'+check(basePath+'.teamMode','按团队角色折算（'+opts.teamToggle+'）')+'</div>':'')+
    (rows || '<div class="empty">暂无获奖记录</div>')+
    '<div style="margin-top:8px"><button data-add="'+basePath+'.awards">+ 添加获奖</button></div>';
}

let f3Tab = 'B1';

const F3_SUBS = [
  {k:'B1', n:'职业技能', d:'技能培训、四六级、职业资格'},
  {k:'B2', n:'学科竞赛', d:'学科竞赛获奖'},

function viewF3(){
  const r = ENGINE.total(state);
  const bodies = {B1:b1Body, B2:b2Body, B3:b3Body, B4:b4Body, B5:b5Body, B6:b6Body, B7:b7Body, B8:b8Body};

  const grid = '<div class="f3-grid">' + F3_SUBS.map(function(s){
    const b = r.B[s.k] || {score:0};
    const cap = RULES.B_CAP[s.k];
    const pct = Math.min(100, Math.round(b.score / cap * 100));
    const cls = (f3Tab===s.k?' on':'') + (b.score>=cap?' full':'');
    return '<button class="f3-card'+cls+'" data-f3="'+s.k+'">'+
      '<div class="h"><b>'+s.k+'</b>'+s.n+'</div>'+
      '<div class="s">'+b.score+'<span>/'+cap+'</span></div>'+
      '<div class="b"><i style="width:'+pct+'%"></i></div>'+
    '</button>';
  }).join('') + '</div>';

  const cur = F3_SUBS.find(function(x){ return x.k === f3Tab; }) || F3_SUBS[0];
  const inner = bodies[cur.k] ? bodies[cur.k]() : '';

  const head = '<div class="f3-cur">'+
      '<span class="k">'+cur.k+'</span>'+
      '<span class="n">'+cur.n+'</span>'+
      '<span class="d">'+cur.d+'</span>'+
      '<span class="p">上限 '+RULES.B_CAP[cur.k]+' 分</span>'+
    '</div>';

  const related = (state.proofs || []).filter(function(p){ return p.module === cur.k; });
  const relatedHtml = related.length
    ? '<div class="proof-mini"><span class="hint" style="align-self:center;margin-right:2px">关联证明 '+related.length+' 张：</span>'+
      related.map(function(p){ return '<img data-view="'+p.id+'" data-proof-img="'+p.id+'" alt="'+esc(p.note||'')+'" loading="lazy">'; }).join('')+
      '</div>'
    : '';
  const body = grid + head + inner + relatedHtml;

  const capped = Object.keys(r.B).reduce(function(a,k){ return a + r.B[k].score; }, 0) > r.F3;
  return card('F3','③ 创新实践 F3', body, {
    pill: r.F3+' / 100',

    meta: capped ? '<span class="pill warn">各项合计已封顶 100</span>' : '<span class="pill gray">各项上限 20 · 合计上限 100</span>'
  });
}

/* 渲染后异步填充图片 + 绑定上传事件 */
function hydrateProofImages(){
  (state.proofs || []).forEach(function(p){
    /* 同一张图可能同时出现在“活动缩略条”和“证明材料卡片”里，需全部填充 */
    const imgs = document.querySelectorAll('[data-proof-img="'+p.id+'"]');
    if(!imgs.length) return;
    const pending = Array.prototype.filter.call(imgs, function(im){ return !im.getAttribute('src'); });
    if(!pending.length) return;
    idbGet(p.id).then(function(blob){
      if(!blob) return;
      const src = blobSrc(p.id, blob);
      pending.forEach(function(im){ im.src = src; im.style.opacity = 1; });
    }).catch(function(){});
  });
}

function bindProofUpload(){
  const drop = document.getElementById('proofDrop');
  if(!drop) return;

  let input = document.getElementById('proofInput');
  if(!input){
    input = document.createElement('input');
    input.type = 'file';
    input.id = 'proofInput';
    input.accept = 'image/*';
    input.multiple = true;
    input.style.display = 'none';
    document.body.appendChild(input);
  }

  drop.addEventListener('click', function(){ input.click(); });
  input.addEventListener('change', function(e){
    if(e.target.files && e.target.files.length){
      handleProofFiles(e.target.files);
    }
    e.target.value = '';
  });

  ['dragenter','dragover'].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function(e){
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
      handleProofFiles(e.dataTransfer.files);
    }
  });
}

function handleProofFiles(files){
  const list = Array.prototype.slice.call(files).filter(function(f){ return /^image\//.test(f.type); });
  if(!list.length){ toast('请选择图片文件'); return; }
  if(!state.proofs) state.proofs = [];
  toast('正在处理 ' + list.length + ' 张图片…');

  let chain = Promise.resolve();
  list.forEach(function(file){
    chain = chain.then(function(){
      return compressImage(file, 1600, 0.82).then(function(blob){
        const id = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        return idbPut(id, blob).then(function(){
          state.proofs.push({
            id: id,
            name: file.name,
            size: blob.size,
            type: blob.type || file.type,
            note: '',
            module: '',
            createdAt: new Date().toISOString()
          });
        });
      });
    });
  });

  chain.then(function(){
    persist(); render();
    toast('已添加 ' + list.length + ' 张图片');
  }).catch(function(e){
    alert('保存失败：' + (e && e.message ? e.message : e) + '\n可能是浏览器存储空间不足');
  });
}

function deleteProof(id){
  state.proofs = (state.proofs || []).filter(function(p){ return p.id !== id; });
  forgetBlob(id);
  idbDel(id).catch(function(){});
  persist(); render();
  toast('已删除');
}

function openLightbox(id){
  let box = document.getElementById('lightbox');
  if(!box){
    box = document.createElement('div');
    box.id = 'lightbox';
    box.className = 'lightbox';
    box.innerHTML = '<button class="lb-close" data-lb-close="1">✕</button>'+
                    '<img id="lbImg" alt=""><div class="lb-cap" id="lbCap"></div>';
    document.body.appendChild(box);
    box.addEventListener('click', function(e){
      if(e.target === box || e.target.dataset.lbClose){ box.hidden = true; }
    });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){ const b = document.getElementById('lightbox'); if(b) b.hidden = true; }
    });
  }
  const p = (state.proofs || []).find(function(x){ return x.id === id; });
  const img = document.getElementById('lbImg');
  const cap = document.getElementById('lbCap');
  cap.textContent = (p && (p.note || p.name)) || '';

  if(_blobUrls[id]){
    img.src = _blobUrls[id];
    box.hidden = false;
    return;
  }
  idbGet(id).then(function(blob){
    if(!blob) return;
    img.src = blobSrc(id, blob);
    box.hidden = false;
  });
}

/* --- 结果明细 --- */

  let g = '<div class="table-wrap"><table><thead><tr><th>模块</th><th class="num">基础分</th><th class="num">原始得分</th><th class="num">封顶后</th><th class="num">计入 F3</th></tr></thead><tbody>';

  for(const k of Object.keys(r.B)){
    const b = r.B[k];
    const capped = b.raw > RULES.B_CAP[k];
    g += '<tr><td>'+k+' '+names[k]+'</td><td class="num">'+(b.base?b.base:'—')+'</td><td class="num">'+b.raw+'</td>'+
      '<td class="num">'+(capped?'<span class="pill warn">'+b.score+'</span>':'<b>'+b.score+'</b>')+'</td><td class="num">'+b.score+'</td></tr>';
  }
  g += '<tr><td colspan="4"><b>F3 合计</b></td><td class="num"><b>'+r.F3+'</b></td></tr></tbody></table></div>';

  const step = '<div class="table-wrap"><table><thead><tr><th>步骤</th><th>计算式</th><th class="num">得分</th></tr></thead><tbody>'+
    '<tr><td>基本素质 F1</td><td class="hint">A1+A2+A3+A4+A5</td><td class="num">'+r.F1+'</td></tr>'+
    '<tr><td>课程成绩 F2</td><td class="hint">Σ(学分×成绩) ÷ Σ学分</td><td class="num">'+r.F2+'</td></tr>'+
    '<tr><td>创新实践 F3</td><td class="hint">B1~B8 各项封顶后求和，合计不超过 100</td><td class="num">'+r.F3+'</td></tr>'+
    '<tr style="background:#f7f9ff"><td><b>综测总分</b></td><td class="hint">F1×10% + F2×65% + F3×25%<br>= '+
      r.F1+'×0.1 + '+r.F2+'×0.65 + '+r.F3+'×0.25</td><td class="num"><b style="font-size:16px;color:var(--primary)">'+r.total.toFixed(2)+'</b></td></tr>'+
    '</tbody></table></div>';

  const body = '<div class="sub-head">创新实践 F3 构成</div>'+g+
    '<div class="sub-head">综测总分计算</div>'+step+
    '<div class="sub-head">学业参考</div>'+
    '<div class="p531-brief"><span class="st">平均学分绩点 <b>'+r.gpa.toFixed(2)+'</b>（总学分 '+r.credit+'，不计入综测总分）</span>'+
      '<button class="tiny go" data-tab="GPA">查看绩点明细 →</button></div>'+
    '<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">'+
      '<button data-print="1">打印 / 存为 PDF</button>'+
      '<button data-export="csv">导出明细 CSV</button>'+
    '</div>'+
    '<div class="hint" style="margin-top:10px">版本 '+APP_VERSION+'</div>'+
    '<div class="hint print-hide">提示：打印时自动展开所有折叠内容（仅当前标签页）。导出 CSV 可用 Excel 打开核对各分项。</div>';

  const pillCls = r.total>=80?'ok':r.total>=60?'warn':'bad';
  return card('result','📊 结果明细与计算过程', body, {pill:r.total.toFixed(2), pillCls:pillCls, meta:'<span class="pill gray">'+r.grade+'</span>'});
}

function exportCSV(){
  const r = ENGINE.total(state);
  const rows = [['模块','项目','分值']];
  for(const p of r.parts) rows.push(['F1',p.key+' '+p.name, p.score]);
  rows.push(['F1','小计', r.F1]);
  rows.push(['F2','学分加权平均', r.F2]);
  const names = {B1:'职业技能',B2:'学科竞赛',B3:'科技学术',B4:'文艺宣传',B5:'社会工作',B6:'社会实践',B7:'文体竞赛',B8:'劳育'};
  for(const k of Object.keys(r.B)) rows.push(['F3',k+' '+names[k], r.B[k].score]);
  rows.push(['F3','小计', r.F3]);
  rows.push(['总分','F1×10%+F2×65%+F3×25%', r.total]);
  rows.push(['绩点','平均学分绩点（不计入总分）', r.gpa]);
  rows.push(['绩点','计入总学分', r.credit]);
  rows.push(['版本','APP_VERSION', APP_VERSION]);
  const csv = '\ufeff' + rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  download('综测明细_'+(state.profile.name||'')+'_'+new Date().toISOString().slice(0,10)+'.csv', csv);
  toast('已导出 CSV');
}

/* ============ 渲染主流程 ============ */
function bodyFor(tab){
  switch(tab){
    case 'basic': return viewBasic();
    case 'S5531': return view5531();
    case 'F1': return viewF1();
    case 'F2': return viewF2();
    case 'F3': return viewF3();
    case 'GPA': return viewGPA();
    case 'result': return viewResult();
  }
  return '';
}

let collapsed = {};
function render(){
  const app = document.getElementById('app');
  const scrollY = window.scrollY;
  const active = document.activeElement;
  const focusPath = active && active.dataset ? active.dataset.bind : null;
  const caret = active && active.selectionStart != null ? active.selectionStart : null;

  app.innerHTML =
    renderSummary() +
    renderTabs() +
    '<div id="pane">'+bodyFor(activeTab)+'</div>' +
    '<div id="statusBox">'+renderStatus()+'</div>' +
    footerHtml();

  // 恢复折叠状态
  document.querySelectorAll('.card[data-card]').forEach(c=>{
    if(collapsed[c.dataset.card]) c.classList.add('collapsed');
  });

  // 恢复焦点（避免输入时跳光标）
  if(focusPath){
    const el = document.querySelector('[data-bind="'+CSS_escape(focusPath)+'"]');
    if(el){ el.focus(); try{ if(caret!=null) el.setSelectionRange(caret,caret); }catch(e){} }
  } else {
    window.scrollTo(0, scrollY);
  }

  afterRender();
}

/* 每次渲染后：填充图片、绑定上传 */
function afterRender(){
  if(activeTab === 'S5531'){
    bindProofUpload();
  }
  if(activeTab === 'S5531' || activeTab === 'F3'){
    hydrateProofImages();
  }
}

function CSS_escape(s){ return String(s).replace(/"/g,'\\"'); }

function footerHtml(){
  return '<footer>湖南师范大学医学部本科生综合素质测评 · 本地个人版 · <span title="按时间生成">'+APP_VERSION+'</span><br>'+
    '数据仅保存在本机浏览器，不会上传。换设备或清理浏览器前请先「导出备份」。<br>'+
    '<span id="savedAt">'+(state.updatedAt?'上次保存 '+new Date(state.updatedAt).toLocaleString('zh-CN',{hour12:false}):'尚未保存')+'</span></footer>';
}

/* ============ 事件绑定 ============ */
function bindEvents(){
  const app = document.getElementById('app');

  app.addEventListener('click', function(e){
    const t = e.target.closest('[data-tab],[data-f3],[data-toggle],[data-add],[data-del],[data-clear],[data-export],[data-print],[data-preset],[data-bulk],[data-proof-del],[data-view]');
    if(!t) return;

    if(t.dataset.tab){ activeTab = t.dataset.tab; window.scrollTo(0,0); render(); return; }

    if(t.dataset.f3){ f3Tab = t.dataset.f3; render(); return; }

    if(t.dataset.print){ window.print(); return; }

    if(t.dataset.proofDel){ deleteProof(t.dataset.proofDel); return; }

    if(t.dataset.view){ openLightbox(t.dataset.view); return; }

    if(t.dataset.toggle){
      const k = t.dataset.toggle;
      collapsed[k] = !collapsed[k];
      const card = t.closest('.card');
      if(card) card.classList.toggle('collapsed', collapsed[k]);
      t.setAttribute('aria-expanded', collapsed[k] ? 'false' : 'true');
      return;
    }

    if(t.dataset.preset === 'term'){
      const exist = {};
      state.courses.forEach(function(c){ exist[(c.name||'').trim()] = true; });
      let added = 0;
      PRESET_COURSES.forEach(function(p){
        if(exist[p.name]) return;
        state.courses.push({name:p.name, credit:p.credit, type:p.type, score:'', grade:''});
        added++;
      });
      persist(); render();
      toast(added ? '已填入 '+added+' 门课程，请填写成绩' : '本学期课程已全部存在');
      return;
    }

    if(t.dataset.bulk === 'apply'){
      const box = document.getElementById('bulkBox');
      const raw = box ? box.value : '';
      if(!raw.trim()){ toast('请先粘贴内容'); return; }
      const rows = parseBulk(raw);
      let updated = 0, created = 0, failed = 0;
      rows.forEach(function(r){
        if(!r.name){ failed++; return; }
        const key = r.name.replace(/\s+/g,'');
        const hit = state.courses.find(function(c){ return (c.name||'').replace(/\s+/g,'') === key; });
        if(hit){
          if(isFinite(r.credit) && r.credit > 0) hit.credit = r.credit;
          if(isFinite(r.score)){ hit.score = r.score; hit.grade = ''; }
          updated++;
        } else {
          if(!isFinite(r.score)){ failed++; return; }
          state.courses.push({name:r.name, credit:isFinite(r.credit)?r.credit:'', type:'专业必修', score:r.score, grade:''});
          created++;
        }
      });
      persist(); render();
      toast('更新 '+updated+' 门，新增 '+created+' 门'+(failed?'，跳过 '+failed+' 行':''));
      return;
    }

    if(t.dataset.add){
      const path = t.dataset.add;
      const arr = get(path, []);
      if(path === 'courses') arr.push({name:'',type:'专业必修',credit:'',score:'',grade:''});
      else if(path === 'F1.A1.trainings') arr.push({type:RULES.T1[0].type, role:'组员'});
      else if(path === 'F1.A4.punish') arr.push({type:RULES.A4[0].t, count:1});
      else if(path === 'B1.certs') arr.push({idx:'0'});
      else if(path === 'B4.media') arr.push({col:'0', pos:0, note:''});
      else if(path === 'B5.posts') arr.push({col:'5', level:'优秀', half:false});
      else if(path === 'B6.vols') arr.push({idx:'0', hours:''});
      else if(path === 'B6.honors') arr.push({row:'0', col:'0'});
      else if(path === 'B8.items') arr.push({row:'0', col:'0', times:1});
      else if(path === 'B3.lectures') arr.push({date:'', name:''});
      else if(path === 'B7.activityList') arr.push({date:'', name:''});
      else if(path === 'B6.growth') arr.push({date:'', name:''});
      else if(path === 'B3.projects') arr.push({col:'0', role:'0'});
      else if(path === 'B3.papers') arr.push({row:'0', col:'2', note:''});
      else if(path === 'B3.books') arr.push({row:'0', col:'0'});
      else arr.push({});
      setQuiet(path, arr); persist(); render();
      return;
    }

    if(t.dataset.del){
      const path = t.dataset.del, idx = parseInt(t.dataset.idx);
      const arr = get(path, []).slice();
      arr.splice(idx,1);
      setQuiet(path, arr); persist(); render();
      return;
    }

    if(t.dataset.clear){
      const path = t.dataset.clear;
      if(confirm('确定清空该列表的全部记录？')){ setQuiet(path, []); persist(); render(); }
      return;
    }

    if(t.dataset.export === 'csv'){ exportCSV(); return; }
  });

  app.addEventListener('input', function(e){
    const el = e.target;
    const path = el.dataset ? el.dataset.bind : null;
    if(!path) return;
    let v;
    if(el.type === 'checkbox') v = el.checked;
    else if(el.type === 'number') v = el.value;
    else v = el.value;
    // 直接写状态，不重渲染全部（保留光标）；汇总区实时更新
    const parts = path.split('.'); let cur = state;
    for(let i=0;i<parts.length-1;i++){ if(!cur[parts[i]]) cur[parts[i]] = {}; cur = cur[parts[i]]; }
    cur[parts[parts.length-1]] = v;
    persist();
    liveUpdate();
  });

  app.addEventListener('change', function(e){
    const el = e.target;
    const path = el.dataset ? el.dataset.bind : null;
    if(!path) return;
    if(el.tagName === 'SELECT' || el.type === 'checkbox'){
      let v = el.type === 'checkbox' ? el.checked : el.value;
      const parts = path.split('.'); let cur = state;
      for(let i=0;i<parts.length-1;i++){ if(!cur[parts[i]]) cur[parts[i]] = {}; cur = cur[parts[i]]; }
      cur[parts[parts.length-1]] = v;
      persist(); render();
    }
  });

  /* 键盘操作卡片折叠（Enter / 空格） */
  app.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const t = e.target.closest('[data-toggle]');
    if(!t) return;
    e.preventDefault();
    t.click();
  });
}

/* 输入时轻量刷新：只更新汇总与状态提示 */
function liveUpdate(){
  const sum = document.querySelector('.summary');
  if(sum) sum.outerHTML = renderSummary();
  const st = document.getElementById('statusBox');
  if(st) st.outerHTML = '<div id="statusBox">'+renderStatus()+'</div>';
}

/* ============ 初始化 ============ */
function init(){
  const loaded = loadState();
  document.getElementById('root').innerHTML =
    '<div class="wrap">'+
      '<header>'+
        '<div><h1>医学部综测测评</h1><div class="sub">湖南师范大学医学部本科生综合素质测评 · 个人版</div></div>'+
        '<div class="toolbar">'+
          '<a class="btn-a" href="'+'rules.docx'+'" target="_blank" rel="noopener" title="打开《湖南师范大学医学部本科生综合素质测评实施细则》">📄 细则原文</a>'+
          '<button data-act="backup">导出备份</button>'+
          '<button data-act="import">导入备份</button>'+
          '<button data-act="reset" class="danger ghost">清空数据</button>'+
        '</div>'+
      '</header>'+
      '<div id="app"></div>'+
    '</div>';
  document.body.insertAdjacentHTML('beforeend','<input type="file" id="fileInput" accept=".json,application/json" style="display:none">');

  document.querySelector('.toolbar').addEventListener('click', function(e){
    const b = e.target.closest('[data-act]');
    if(!b) return;
    if(b.dataset.act === 'backup') doBackup();
    if(b.dataset.act === 'import') document.getElementById('fileInput').click();
    if(b.dataset.act === 'reset'){
      if(confirm('将清空本机保存的所有综测数据，且无法撤销。建议先导出备份。确定继续？')){
        state = blankState(); persist(); render(); toast('已清空');
      }
    }
  });

  document.getElementById('fileInput').addEventListener('change', function(e){
    const f = e.target.files && e.target.files[0];
    if(f) doImport(f);
    e.target.value = '';
  });

  render();
  bindEvents();
  /* 申请持久化存储，降低浏览器自动清理本地数据的概率（不支持时静默忽略） */
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persist().catch(function(){});
  }
  if(!loaded) setTimeout(()=>toast('开始录入吧，数据会自动保存'), 400);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
